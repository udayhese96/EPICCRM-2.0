[build]
  publish = ".next"
  command = "rm -rf node_modules pnpm-lock.yaml .pnpm-store && npm install && npm run build"
  functions = ".netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-frozen-lockfile"
  # Force npm usage and disable pnpm
  NPM_CONFIG_PACKAGE_MANAGER = "npm"
  COREPACK_ENABLE_STRICT = "0"

[dev]
  command = "npm run dev"
  port = 3000
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
